# ═══════════════════════════════════════════════════════════════════════
#  TeleHop - Velocity Proxy Configuration
# ═══════════════════════════════════════════════════════════════════════
#
#  This file is for the VELOCITY PROXY only (not Paper servers).
#  It lives at: plugins/telehop-velocity/config.properties
#
#  The proxy acts as the central router - it forwards teleport requests,
#  TPA packets, and player-list updates between all Paper backends.
#
#  After making changes, restart the Velocity proxy.
#
# ═══════════════════════════════════════════════════════════════════════


# ── Proxy Identity ────────────────────────────────────────────────────
#
#  A unique identifier for this proxy instance. Used in multi-proxy
#  setups to tag Redis messages so each proxy knows which messages
#  are for it. Has no gameplay effect - players never see this.
#
#  Use a descriptive name like "proxy-usa-1", "proxy-eu-1", etc.
#  Each proxy in your network MUST have a different ID.

proxy.id=proxy-1


# ── Multi-Proxy Support ──────────────────────────────────────────────
#
#  Enable this when running two or more Velocity proxies that share
#  the same set of backend servers (e.g. a USA proxy and an EU proxy).
#
#  When enabled, proxies communicate via Redis so TPA requests,
#  admin teleports, and player lookups work across proxy boundaries.
#
#  When disabled (default), no Redis connection is made and there is
#  zero overhead - TeleHop behaves exactly as a single-proxy setup.
#
#  multi-proxy.enabled              - Master toggle for cross-proxy features.
#  multi-proxy.global-player-list   - If true, /tpa tab-complete and player
#                                     lists include players from ALL proxies.
#  multi-proxy.cross-proxy-timeout-ms - Timeout for cross-proxy requests.
#                                       Higher than local timeout to account
#                                       for the Redis round-trip.

multi-proxy.enabled=false
multi-proxy.global-player-list=true
multi-proxy.cross-proxy-timeout-ms=15000


# ── Redis ─────────────────────────────────────────────────────────────
#
#  Only used when multi-proxy.enabled=true. Ignored otherwise.
#
#  TeleHop uses Redis pub/sub for real-time cross-proxy communication.
#  You can share the same Redis instance with other plugins (LuckPerms,
#  HuskSync, etc.) - TeleHop uses its own channel prefix.
#
#  redis.host           - Redis hostname or IP.
#  redis.port           - Redis port (default 6379).
#  redis.password       - Redis password. Leave empty for no auth.
#  redis.channel-prefix - Prefix for all pub/sub channels. Each TeleHop
#                          network should use a unique prefix if sharing
#                          a Redis instance across multiple networks.
#
#  TLS (encrypted Redis connections):
#
#  redis.ssl            - Set to true to connect to Redis over TLS
#                          (the rediss:// protocol). Your Redis server
#                          must be configured with TLS support.
#  redis.ssl-verify     - Verify the server certificate and hostname.
#                          Keep this true in production. Set to false
#                          only for testing (traffic is still encrypted,
#                          but the server is not authenticated).
#  redis.ssl-ca-cert    - Optional path to a CA certificate (PEM) for
#                          self-signed setups, e.g. /etc/redis/ca.crt
#                          Leave empty to use the system trust store.

redis.host=127.0.0.1
redis.port=6379
redis.password=
redis.channel-prefix=telehop
redis.ssl=false
redis.ssl-verify=true
redis.ssl-ca-cert=


# ── MySQL Database ──────────────────────────────────────────────────────
#
#  MUST be the exact same database that all Paper backends connect to.
#  TeleHop will not work if any server points to a different database.
#
#  mysql.host      - IP or hostname of the MySQL server.
#                    Use 127.0.0.1 if MySQL runs on the same machine.
#  mysql.port      - MySQL port (default 3306).
#  mysql.database  - Database name (must already exist).
#  mysql.username  - MySQL user with SELECT/INSERT/UPDATE/DELETE.
#  mysql.password  - Password for the MySQL user.
#  mysql.poolSize  - Connection pool size. 5 is fine for most setups.
#                    Increase to 10 for 100+ concurrent players.
#
#  Example:
#    mysql.host=10.0.0.5
#    mysql.port=3306
#    mysql.database=telehop
#    mysql.username=telehop
#    mysql.password=s3cure-passw0rd
#    mysql.poolSize=5

mysql.host=127.0.0.1
mysql.port=3306
mysql.database=telehop
mysql.username=telehop
mysql.password=change-me
mysql.poolSize=5


# ── Messaging Tuning ───────────────────────────────────────────────────
#
#  Internal settings for packet deduplication and timeouts.
#  You almost never need to change these.
#
#  messaging.dedupeWindowMs   - Milliseconds to remember processed
#                               packets (prevents duplicates).
#                               Default: 30000 (30 seconds).
#  messaging.requestTimeoutMs - Milliseconds to wait for a response
#                               from a backend server before giving up.
#                               Default: 10000 (10 seconds).
#                               Increase if backends are far apart.

messaging.dedupeWindowMs=30000
messaging.requestTimeoutMs=10000


# ── Server Configuration ───────────────────────────────────────────────
#
#  servers.hub - The name of the lobby/hub server. When a player runs
#                /spawn, they are sent to this server. This name MUST
#                match an entry in your velocity.toml [servers] section.
#
#                Example: if velocity.toml has  lobby = "127.0.0.1:25565"
#                then set  servers.hub=lobby
#
#  servers.backends - A comma-separated list of ALL servers that run
#                     the TeleHop Paper plugin. Include the hub server.
#                     Each name must match a velocity.toml [servers] entry.
#
#                     No spaces between names, just commas.
#
#  Example - single server:
#    servers.hub=lobby
#    servers.backends=lobby
#
#  Example - three servers:
#    servers.hub=lobby
#    servers.backends=lobby,eu,usa
#
#  Example - large network:
#    servers.hub=lobby
#    servers.backends=lobby,eu,usa,creative,skyblock,prison

servers.hub=lobby
servers.backends=lobby

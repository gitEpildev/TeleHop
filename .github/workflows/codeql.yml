name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run weekly so dependency-level CVEs that were introduced upstream are
  # caught even without new commits.
  schedule:
    - cron: '0 3 * * 1' # every Monday at 03:00 UTC

permissions:
  security-events: write # required to upload SARIF results
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    # CodeQL analysis can be slow; give it plenty of room.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the build toolchains
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual
          queries: security-and-quality

      - name: Build for CodeQL
        run: mvn -B compile -DskipTests --no-transfer-progress

      # Run the analysis and upload the SARIF report to the Security tab.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-progress runs for the same ref so a rapid push doesn't waste minutes.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Gate 1 - Checkstyle
  # Fast style check. Runs in parallel with compile and validate.
  # ───────────────────────────────────────────────────────────────────────────
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check --no-transfer-progress

  # ───────────────────────────────────────────────────────────────────────────
  # Gate 2 - Full compilation
  # Compiles ALL modules (common, paper, velocity). This catches broken imports,
  # missing classes, and API mismatches in paper/velocity before tests run.
  # Without this gate, a paper-module compile error would only be caught in the
  # final build job - after the test gate had already passed.
  # ───────────────────────────────────────────────────────────────────────────
  compile:
    name: Compile All Modules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
          cache: maven

      - name: Compile
        run: mvn -B compile --no-transfer-progress

      - name: Verify version adapters compiled
        run: |
          echo "Checking adapter class files..."
          test -f paper-versions/paper.1.21.x/target/classes/com/telehop/paper/v1_21/Paper121Adapter.class \
            || { echo "::error::Paper121Adapter did not compile"; exit 1; }
          test -f paper-versions/paper.26.1.x/target/classes/com/telehop/paper/v26_1/Paper261Adapter.class \
            || { echo "::error::Paper261Adapter did not compile"; exit 1; }
          echo "Both version adapters compiled successfully."

      - name: Compile test sources
        run: mvn -B test-compile --no-transfer-progress

  validate:
    uses: ./.github/workflows/validate.yml

  # ───────────────────────────────────────────────────────────────────────────
  # Tests + Coverage
  # Runs after compilation succeeds. Uses `verify` (not just `test`) so JaCoCo
  # report generation is guaranteed to run.
  # On pull requests a coverage summary is posted as a PR comment.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    permissions:
      contents: read
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    needs: [compile, validate]

    outputs:
      version: ${{ steps.bundle.outputs.version }}
      bundle: ${{ steps.bundle.outputs.name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
          cache: maven
      - name: Clean build and test every module
        run: mvn -B -ntp clean verify
      - name: Verify and bundle runtime test artifacts
        id: bundle
        run: |
          version=$(sed -n 's/^version: //p' paper/src/main/resources/plugin.yml)
          bash .github/tests/bundle.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=test-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: |
            release-bundle/telehop-paper-${{ steps.bundle.outputs.version }}.jar
            release-bundle/telehop-velocity-${{ steps.bundle.outputs.version }}.jar
            release-bundle/command-probe.jar
            release-bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish JUnit Results
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: JUnit Test Results
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          require_tests: true
          fail_on_failure: true
          detailed_summary: true

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: '*/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Post Coverage Comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: common/target/site/jacoco/jacoco.xml,paper/target/site/jacoco/jacoco.xml,velocity/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 75
          min-coverage-changed-files: 80
          title: Test Coverage Report
          update-comment: true

  runtime:
    needs: test
    uses: ./.github/workflows/runtime-tests.yml
    with:
      bundle: ${{ needs.test.outputs.bundle }}
      version: ${{ needs.test.outputs.version }}

  platforms:
    needs: test
    uses: ./.github/workflows/backend-platforms.yml
    with:
      bundle: ${{ needs.test.outputs.bundle }}
      version: ${{ needs.test.outputs.version }}

  upgrades:
    needs: test
    uses: ./.github/workflows/profile-upgrade.yml
    with:
      bundle: ${{ needs.test.outputs.bundle }}
      version: ${{ needs.test.outputs.version }}

  compatibility:
    uses: ./.github/workflows/compatibility.yml

  readiness:
    name: Release readiness
    if: always()
    needs: [checkstyle, compile, validate, test, compatibility, runtime, platforms, upgrades]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful results for every build and test job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          for job, status in results.items():
              print(f"{job}: {status['result']}")
          if any(job["result"] != "success" for job in results.values()):
              sys.exit("Release readiness failed. Every required job must run and succeed.")
          PYTHON

  build:
    name: Distribute verified JARs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [readiness, test]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.test.outputs.bundle }}
          path: bundle
      - name: Upload Paper JAR
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telehop-paper
          path: bundle/telehop-paper-*.jar
          if-no-files-found: error

      - name: Upload Velocity JAR
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telehop-velocity
          path: bundle/telehop-velocity-*.jar
          if-no-files-found: error

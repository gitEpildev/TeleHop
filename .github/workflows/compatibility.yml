name: Compatibility Matrix

on: workflow_call

permissions:
  contents: read

jobs:

  paper-adapters:
    name: "Backend world adapter for Minecraft ${{ matrix.mc-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc-version: "1.21.x"
            module: paper-versions/paper.1.21.x
            adapter-class: com/telehop/paper/v1_21/Paper121Adapter.class
            java-build: "21"
            java-runtime: "21"

          - mc-version: "26.1+"
            module: paper-versions/paper.26.1.x
            adapter-class: com/telehop/paper/v26_1/Paper261Adapter.class
            java-build: "25"
            java-runtime: "25"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
          cache: maven

      - name: Compile adapter module
        run: mvn -B compile -pl paper-versions/paper-version-api,${{ matrix.module }} -am --no-transfer-progress

      - name: Verify adapter class exists
        run: |
          CLASSFILE="${{ matrix.module }}/target/classes/${{ matrix.adapter-class }}"
          if [ -f "$CLASSFILE" ]; then
            echo "Adapter class compiled successfully."
          else
            echo "::error::Adapter class not found: $CLASSFILE"
            exit 1
          fi

      - name: Check bytecode version
        run: |
          CLASSFILE="${{ matrix.module }}/target/classes/${{ matrix.adapter-class }}"
          MAJOR=$(javap -verbose "$CLASSFILE" 2>/dev/null | grep "major version" | awk '{print $NF}')
          case "$MAJOR" in
            65) JAVA_VER="21" ;;
            66) JAVA_VER="22" ;;
            67) JAVA_VER="23" ;;
            68) JAVA_VER="24" ;;
            69) JAVA_VER="25" ;;
            *) JAVA_VER="unknown ($MAJOR)" ;;
          esac
          echo "Bytecode major version: $MAJOR (Java $JAVA_VER)"
          if [[ "$JAVA_VER" != "21" ]]; then
            echo "::error::Adapter bytecode targets Java $JAVA_VER. The shared backend JAR requires Java 21 bytecode."
            exit 1
          fi
          echo "BYTECODE_JAVA=$JAVA_VER" >> $GITHUB_ENV

      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### Backend world adapter for Minecraft ${{ matrix.mc-version }}

          | Property | Value |
          |----------|-------|
          | Adapter Module | \`${{ matrix.module }}\` |
          | Build JDK | ${{ matrix.java-build }} |
          | Runtime JDK | ${{ matrix.java-runtime }} |
          | Bytecode Target | Java ${{ env.BYTECODE_JAVA }} |
          | Status | Compiled successfully |

          EOF

  velocity:
    name: Shared Velocity API (3.x and 4.x)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
          cache: maven

      - name: Compile Velocity module
        run: mvn -B compile -pl velocity -am --no-transfer-progress

      - name: Extract Velocity API version
        id: vel-ver
        run: |
          VEL_API=$(grep -m1 '<velocity.api.version>' pom.xml | sed 's/.*<velocity.api.version>\(.*\)<\/velocity.api.version>.*/\1/' | tr -d '[:space:]')
          echo "api=$VEL_API" >> $GITHUB_OUTPUT

      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### Velocity Proxy

          | Property | Value |
          |----------|-------|
          | Velocity API | ${{ steps.vel-ver.outputs.api }} |
          | Build JDK | 21 |
          | Runtime JDK | 21+ |
          | Status | Compiled successfully |
          EOF

  shaded-jar:
    name: Shaded JAR (all adapters)
    runs-on: ubuntu-latest
    needs: [paper-adapters, velocity]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
          cache: maven

      - name: Build shaded JARs
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Verify adapters in the shaded Bukkit backend JAR
        run: |
          echo "Checking shaded JAR contents..."
          BACKEND_JAR=$(ls paper/target/telehop-bukkit-*.jar | head -1)
          JAR_SIZE=$(du -h "$BACKEND_JAR" | cut -f1)
          echo "Bukkit backend JAR: $BACKEND_JAR ($JAR_SIZE)"

          FOUND_121=$(jar tf "$BACKEND_JAR" | grep "Paper121Adapter.class" || true)
          FOUND_261=$(jar tf "$BACKEND_JAR" | grep "Paper261Adapter.class" || true)
          FOUND_API=$(jar tf "$BACKEND_JAR" | grep "VersionAdapter.class" || true)

          FAIL=0
          if [ -z "$FOUND_121" ]; then
            echo "::error::Paper121Adapter not found in shaded JAR"
            FAIL=1
          else
            echo "Paper121Adapter: included"
          fi
          if [ -z "$FOUND_261" ]; then
            echo "::error::Paper261Adapter not found in shaded JAR"
            FAIL=1
          else
            echo "Paper261Adapter: included"
          fi
          if [ -z "$FOUND_API" ]; then
            echo "::error::VersionAdapter interface not found in shaded JAR"
            FAIL=1
          else
            echo "VersionAdapter API: included"
          fi

          VEL_JAR=$(ls velocity/target/telehop-velocity-*.jar | head -1)
          VEL_SIZE=$(du -h "$VEL_JAR" | cut -f1)
          echo "Velocity JAR: $VEL_JAR ($VEL_SIZE)"

          echo "BACKEND_JAR_SIZE=$JAR_SIZE" >> $GITHUB_ENV
          echo "VEL_JAR_SIZE=$VEL_SIZE" >> $GITHUB_ENV
          [ $FAIL -eq 0 ] || exit 1

      - name: Extract plugin version
        id: plugin-ver
        run: |
          VER=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d '[:space:]')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Write compatibility summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## TeleHop Compatibility Report

          **Plugin Version:** ${{ steps.plugin-ver.outputs.version }}

          EOF
          python3 .github/release/compatibility.py summary >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF

          ### Build Artefacts

          | JAR | Size | Adapters Included |
          |-----|------|-------------------|
          | telehop-bukkit | ${{ env.BACKEND_JAR_SIZE }} | \`Paper121Adapter\`, \`Paper261Adapter\`, \`VersionAdapter\` API |
          | telehop-velocity | ${{ env.VEL_JAR_SIZE }} | N/A (proxy bridge) |

          EOF

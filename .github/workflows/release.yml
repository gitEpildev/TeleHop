name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v (for example 3.0.0)
        required: true
        type: string
      channel:
        description: Release type
        required: true
        type: choice
        default: release
        options: [release, beta, alpha]
      notes:
        description: Optional Markdown to replace the generated release notes
        type: string

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      publishing: true
      version: ${{ inputs.version || '' }}
      channel: ${{ inputs.channel || '' }}
      notes: ${{ inputs.notes || '' }}

  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.build.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Build, test and verify shaded JARs
        id: build
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mvn -B -ntp clean verify
          bash .github/tests/bundle.sh "$VERSION"
          echo "bundle=release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-bundle/telehop-paper-${{ needs.validate.outputs.version }}.jar
            release-bundle/telehop-velocity-${{ needs.validate.outputs.version }}.jar
            release-bundle/command-probe.jar
          if-no-files-found: error
          retention-days: 14

  runtime:
    needs: [validate, build]
    uses: ./.github/workflows/runtime-tests.yml
    with:
      bundle: ${{ needs.build.outputs.bundle }}
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, build, runtime]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: telehop-release-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: release-bundle/
      - name: Restore validated release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.notes_artifact }}
          path: release-bundle/
      - name: Require a successful push build of this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release/ci_status.py
      - name: Check Modrinth credentials and project
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/release/publish.py preflight
      - name: Publish GitHub release and retrieve its JARs and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release/publish.py github
      - name: Publish or verify Paper and Velocity on Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/release/publish.py modrinth

name: Downloaded distribution checks

on:
  workflow_call:
    inputs:
      bundle:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Check both installable JARs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.bundle }}
          path: bundle
      - name: Verify filenames, embedded versions, adapters, templates and checksums
        env:
          VERSION: ${{ inputs.version }}
        run: python3 .github/release/prepare.py verify-bundle bundle "$VERSION"

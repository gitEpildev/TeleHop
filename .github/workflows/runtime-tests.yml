name: Runtime tests

on:
  workflow_call:
    inputs:
      bundle:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  inventory:
    name: Select pinned runtime builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        run: echo "matrix=$(python3 .github/release/compatibility.py matrix)" >> "$GITHUB_OUTPUT"

  servers:
    needs: inventory
    name: ${{ matrix.server }} / ${{ matrix.suite || 'MySQL migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: telehop_ci
          MYSQL_USER: telehop
          MYSQL_PASSWORD: ci-password
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Java 25 for the newer proxy in the player travel test
        if: matrix.suite == 'network-v4' || matrix.suite == 'network-mixed'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.bundle }}
          path: bundle
      - name: Boot, upgrade legacy data, restart and verify
        env:
          VERSION: ${{ inputs.version }}
          SERVER: ${{ matrix.server }}
          MYSQL_PWD: ci-password
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: python3 .github/tests/server_smoke.py "$SERVER" "$VERSION" bundle smoke
      - name: Install Minecraft client
        if: matrix.suite
        run: npm ci --prefix .github/tests/network --ignore-scripts --no-audit --no-fund
      - name: Test a Minecraft client with a shared protocol version
        if: matrix.suite == 'client-login'
        env:
          CLIENT_VERSION: ${{ matrix.client }}
          VERSION: ${{ inputs.version }}
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_PWD: ci-password
        run: python3 .github/tests/network/client_compatibility.py smoke bundle "$VERSION" network-client "$CLIENT_VERSION"
      - name: Test world and server travel with a Minecraft client
        if: matrix.suite == 'network-v3' || matrix.suite == 'network-v4'
        env:
          VERSION: ${{ inputs.version }}
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_PWD: ci-password
          SUITE: ${{ matrix.suite }}
        run: |
          java -cp "bundle/telehop-velocity-$VERSION.jar" .github/tests/network/SpawnDirectoryCheck.java
          if [[ "$SUITE" == network-v4 ]]; then
            python3 .github/tests/network/run.py smoke bundle "$VERSION" "$SUITE" --proxy velocity-4.3.1 --proxy-java "$JAVA_HOME_25_X64/bin/java"
          else
            python3 .github/tests/network/run.py smoke bundle "$VERSION" "$SUITE"
          fi
      - name: Test two live proxy generations and a rolling upgrade
        if: matrix.suite == 'network-mixed'
        env:
          VERSION: ${{ inputs.version }}
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_PWD: ci-password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server redis-tools
          python3 .github/tests/network/mixed.py smoke bundle "$VERSION" network-mixed --java25 "$JAVA_HOME_25_X64/bin/java"
      - name: Save startup and shutdown logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.server }}-${{ matrix.suite || 'smoke' }}-${{ github.run_attempt }}
          path: |
            smoke/boot-*.log
            network*/**/acceptance.log
          if-no-files-found: ignore

  redis:
    name: Redis cross-proxy delivery and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.bundle }}
          path: bundle
      - name: Install Redis in the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server redis-tools
      - name: Exercise two production Redis bridges
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          java -cp "bundle/telehop-velocity-$VERSION.jar" .github/tests/RedisBridgeCheck.java | tee redis.log
          grep '^Redis forwarding:' redis.log >> "$GITHUB_STEP_SUMMARY"

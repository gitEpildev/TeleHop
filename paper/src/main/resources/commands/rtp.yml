# Enable commands.custom-names.enabled in config.yml to use the names below.
# Restart the backend after changing registered names or aliases.

rtp:
  custom-name:
    enabled: false
    name: rtp
    aliases: []
  # Additional commands also require commands.additional-commands.enabled in config.yml.
  additional-commands:
    enabled: false
    commands: {}

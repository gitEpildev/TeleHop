# To register /hub, set features.hub and features.spawn to true in the active
# profile's features.yml. Choose hub-server in its general.yml and restart.
# To rename /hub, also enable commands.custom-names.enabled in the root
# config.yml and custom-name.enabled below. Players use telehop.hub.

hub:
  custom-name:
    enabled: false
    name: hub
    aliases: []
  # Additional commands also require commands.additional-commands.enabled in config.yml.
  additional-commands:
    enabled: false
    commands: {}

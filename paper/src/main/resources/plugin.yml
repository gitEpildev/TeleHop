name: TeleHop
version: 2.0.0
main: com.telehop.paper.NetworkPaperPlugin
api-version: "1.21"
authors: [Epildev]
description: Cross-server teleportation for Velocity networks.
website: https://developer.epildevconnect.uk/
softdepend: [LuckPerms]

commands:
  spawn:
    description: Teleport to the network spawn.
  rtp:
    description: Random teleport with region and dimension selector.
  warp:
    description: Teleport to a global warp.
  setwarp:
    description: Create or update a global warp.
  delwarp:
    description: Delete a global warp.
  warps:
    description: List all global warps.
  pwarp:
    description: Player warps — create, delete, list, and teleport.
    aliases: [playerwarp, pwarps]
  tpa:
    description: Request to teleport to a player.
  tpahere:
    description: Request a player to teleport to you.
  tpaaccept:
    description: Accept a teleport request.
  tpadeny:
    description: Deny a teleport request.
  tpacancel:
    description: Cancel your outgoing teleport request.
  tpatoggle:
    description: Toggle incoming TPA requests on/off.
  tp:
    description: Admin teleport command.
    permission: telehop.tp
  tphere:
    description: Admin pull-to-you command.
    permission: telehop.tphere
  telehop:
    description: TeleHop admin — reload, version, help, perms.
  listwarps:
    description: List all player warps (admin).
    permission: telehop.admin
  forcedelwarp:
    description: Force-delete any warp (admin or player).
    permission: telehop.admin
  home:
    description: Open the homes GUI or teleport to a named home.
  sethome:
    description: Set a named home at your current location.
  delhome:
    description: Delete a named home.
  forcedelhome:
    description: Force-delete a player's home (admin).
    permission: telehop.admin
  back:
    description: Return to your last location before teleporting.
    permission: telehop.back
  lastlocation:
    description: Teleport to your last logout location.
    aliases: [lastloc, backlast, ll]
  forcelastloc:
    description: View, teleport to, or clear a player's last logout location (admin).
    aliases: [forcell]
    permission: telehop.admin
  forcesethome:
    description: Set a home for another player at your current location (admin).
    permission: telehop.admin
  listhomes:
    description: List a player's homes with teleport and delete buttons (admin).
    permission: telehop.admin
  playerinfo:
    description: View a player's TeleHop data summary (admin).
    aliases: [pinfo]
    permission: telehop.admin

permissions:
  telehop.spawn:
    description: Use /spawn
    default: true
  telehop.rtp:
    description: Use /rtp
    default: true
  telehop.warp:
    description: Use /warp and /warps (admin warps)
    default: true
  telehop.pwarp:
    description: Use /pwarp (player warps)
    default: true
  telehop.tpa:
    description: Use /tpa
    default: true
  telehop.tpahere:
    description: Use /tpahere
    default: true
  telehop.tpa.accept:
    description: Use /tpaaccept
    default: true
  telehop.tpa.deny:
    description: Use /tpadeny
    default: true
  telehop.tpa.cancel:
    description: Use /tpacancel
    default: true
  telehop.tpa.toggle:
    description: Use /tpatoggle
    default: true
  telehop.homes:
    description: Use /home (open GUI, teleport to homes)
    default: true
  telehop.sethome:
    description: Use /sethome (set a named home)
    default: true
  telehop.delhome:
    description: Use /delhome (delete a named home)
    default: true
  telehop.homes.1:
    description: Access 1 home slot
    default: true
  telehop.homes.2:
    description: Access 2 home slots
    default: false
  telehop.homes.3:
    description: Access 3 home slots
    default: false
  telehop.homes.4:
    description: Access 4 home slots
    default: false
  telehop.homes.5:
    description: Access 5 home slots
    default: false
  telehop.homes.6:
    description: Access 6 home slots
    default: false
  telehop.homes.7:
    description: Access 7 home slots
    default: false
  telehop.homes.8:
    description: Access 8 home slots
    default: false
  telehop.homes.9:
    description: Access 9 home slots
    default: false
  telehop.homes.10:
    description: Access 10 home slots
    default: false
  telehop.lastlocation:
    description: Use /lastlocation (teleport to last logout location)
    default: true
  telehop.tp:
    description: Admin teleport
    default: op
  telehop.tphere:
    description: Admin pull command
    default: op
  telehop.admin:
    description: Admin commands — setwarp, delwarp, listwarps, forcedelwarp, forcedelhome, telehop reload/perms
    default: op
  telehop.back:
    description: Use /back (last teleport location)
    default: op
  telehop.back.death:
    description: Use /back death (death location)
    default: op
  telehop.rtp.bypasscooldown:
    description: Bypass RTP cooldown
    default: op
  telehop.rtp.bypassdelay:
    description: Bypass RTP countdown delay
    default: op
  telehop.tpa.bypasscooldown:
    description: Bypass TPA cooldown
    default: op
  telehop.warps.unlimited:
    description: Unlimited player warps
    default: op

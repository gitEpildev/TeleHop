name: TeleHop
version: 4.0.0
main: com.telehop.paper.NetworkPaperPlugin
api-version: "1.21"
authors: [Epildev]
description: Cross-server teleportation for Velocity networks.
website: https://developer.epildevconnect.uk/
softdepend: [LuckPerms]

# ACF registers the built-in roots and enabled labels from the command group files.
permissions:
  telehop.spawn:
    description: Use /spawn
    default: true
  telehop.rtp:
    description: Use /rtp
    default: true
  telehop.warp:
    description: Use /warp and /warps (admin warps)
    default: true
  telehop.pwarp:
    description: Use /pwarp (player warps)
    default: true
  telehop.tpa:
    description: Use /tpa
    default: true
  telehop.tpahere:
    description: Use /tpahere
    default: true
  telehop.tpa.accept:
    description: Use /tpaaccept
    default: true
  telehop.tpa.deny:
    description: Use /tpadeny
    default: true
  telehop.tpa.cancel:
    description: Use /tpacancel
    default: true
  telehop.tpa.toggle:
    description: Use /tpatoggle
    default: true
  telehop.homes:
    description: Use /home (open GUI, teleport to homes)
    default: true
  telehop.sethome:
    description: Use /sethome (set a named home)
    default: true
  telehop.delhome:
    description: Use /delhome (delete a named home)
    default: true
  telehop.homes.1:
    description: Access 1 home slot
    default: true
  telehop.homes.2:
    description: Access 2 home slots
    default: false
  telehop.homes.3:
    description: Access 3 home slots
    default: false
  telehop.homes.4:
    description: Access 4 home slots
    default: false
  telehop.homes.5:
    description: Access 5 home slots
    default: false
  telehop.homes.6:
    description: Access 6 home slots
    default: false
  telehop.homes.7:
    description: Access 7 home slots
    default: false
  telehop.homes.8:
    description: Access 8 home slots
    default: false
  telehop.homes.9:
    description: Access 9 home slots
    default: false
  telehop.homes.10:
    description: Access 10 home slots
    default: false
  telehop.lastlocation:
    description: Use /lastlocation (teleport to last logout location)
    default: true
  telehop.tp:
    description: Admin teleport
    default: op
    children:
      telehop.tp.player.self: true
      telehop.tp.player.others: true
      telehop.tp.coordinates.self: true
      telehop.tp.coordinates.others: true
  telehop.tp.coordinates.self:
    description: Teleport yourself to coordinates
    default: false
  telehop.tp.coordinates.others:
    description: Teleport another player to coordinates
    default: false
  telehop.tphere:
    description: Admin pull command
    default: op
  telehop.admin:
    description: Admin commands - setwarp, delwarp, listwarps, forcedelwarp, forcedelhome, telehop reload/perms
    default: op
    children:
      telehop.admin.config.validate: true
      telehop.admin.platform.info: true
      telehop.admin.migration.status: true
      telehop.admin.diagnostics: true
      telehop.admin.spawn.list: true
      telehop.admin.spawn.set: true
      telehop.admin.spawn.delete: true
      telehop.admin.homes.list: true
      telehop.admin.homes.visit: true
      telehop.admin.homes.set: true
      telehop.admin.homes.delete: true
      telehop.admin.lastlocation.view: true
      telehop.admin.lastlocation.visit: true
      telehop.admin.lastlocation.clear: true
      telehop.admin.warps.set: true
      telehop.admin.warps.list: true
      telehop.admin.warps.delete: true
      telehop.admin.playerwarps.delete: true
      telehop.admin.playerinfo: true
      telehop.admin.commands.list: true
      telehop.admin.commands.validate: true
      telehop.admin.commands.reload: true
      telehop.admin.reload: true
      telehop.admin.permissions: true
  telehop.back:
    description: Use /back (last teleport location)
    default: op
  telehop.back.death:
    description: Use /back death (death location)
    default: op
  telehop.rtp.bypasscooldown:
    description: Bypass RTP cooldown
    default: op
  telehop.rtp.bypassdelay:
    description: Bypass RTP countdown delay
    default: op
  telehop.tpa.bypasscooldown:
    description: Bypass TPA cooldown
    default: op
  telehop.warps.unlimited:
    description: Unlimited player warps
    default: op
  telehop.admin.spawn.list:
    default: false
  telehop.admin.spawn.set:
    default: false
  telehop.admin.spawn.delete:
    default: false
  telehop.admin.homes.list:
    default: false
  telehop.admin.homes.visit:
    default: false
  telehop.admin.homes.set:
    default: false
  telehop.admin.homes.delete:
    default: false
  telehop.admin.lastlocation.view:
    default: false
  telehop.admin.lastlocation.visit:
    default: false
  telehop.admin.lastlocation.clear:
    default: false
  telehop.admin.warps.set:
    default: false
  telehop.admin.warps.list:
    default: false
  telehop.admin.warps.delete:
    default: false
  telehop.admin.playerwarps.delete:
    default: false
  telehop.admin.playerinfo:
    default: false
  telehop.admin.reload:
    default: false
  telehop.admin.permissions:
    default: false
  telehop.hub:
    default: true
  telehop.spawn.named:
    default: true
  telehop.tp.player.self:
    default: false
  telehop.tp.player.others:
    default: false
  telehop.admin.config.validate:
    description: Validate the selected deployment configuration
    default: false
  telehop.admin.platform.info:
    description: Inspect the detected platform and Java runtime
    default: false
  telehop.admin.migration.status:
    description: Inspect the configuration migration state
    default: false
  telehop.admin.diagnostics:
    description: Inspect the active deployment and database health
    default: false
  telehop.admin.commands.list:
    description: Inspect the active command names and aliases
    default: false
  telehop.admin.commands.validate:
    description: Validate the proposed command configuration
    default: false
  telehop.admin.commands.reload:
    description: Reload command rules for registered labels
    default: false
